
{% extends 'Store/base.html' %}
{% block body %}
<div class="flex flex-col justify-center items-center p-4 scale-x-120">
<form method="POST" class="bg-white p-5 rounded-md">
    {% csrf_token %}
    <div>
        <Label>Book Name</Label>
        <div class= "border rounded p-2 m-2">{{form.book_name}}</div>
    </div>
    <div>
        <Label>Author</Label>
        <div class= "border rounded p-2 m-2">{{form.author}}</div>
    </div>
    <div>
        <Label>Publisher</Label>
        <div class= "border rounded p-2 m-2">{{form.publisher}}</div>
    </div>
    <div>
        <Label>Edition</Label>
        <div class= "border rounded p-2 m-2">{{form.edition}}</div>
    </div>
    <div>
        <Label>Genre</Label>
        <div class= "border rounded p-2 m-2">{{form.genre}}</div>
    </div>
    <div>
        <Label>image</Label>
        <div class= "border rounded p-2 m-2">{{form.image}}</div>
    </div>
<div class="py-4">
    <button class="bg-blue-500 text-white w-70 h-10" type="Submit">SAVE</button>
</div>
</form>
</div>
{% endblock %}
